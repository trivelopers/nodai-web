
<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/nodai-centrado.png">

    <link rel="apple-touch-icon" href="/images/nodai-centrado.png">

    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
                fontFamily: {
                    sans: ['Geist', 'Arial', 'sans-serif'],

                    DEFAULT: {
                        css: {
                           '--tw-prose-body': theme('colors.slate[600]'),
                           '--tw-prose-headings': theme('colors.slate[800]'),
                           '--tw-prose-invert-body': theme('colors.slate[300]'),
                           '--tw-prose-invert-headings': theme('colors.slate[100]'),
                        }
                    }
                })
            }
          }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
